# Google Cloud Build -> Artifact Registry -> Cloud Run.
#
# One-time setup (see DEPLOY.md), then:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=sr-generator-api
#
# Or connect this repo in the Cloud Build console for deploy-on-push.
substitutions:
  _REGION: us-central1
  _SERVICE: sr-generator-api
  _REPO: sr-generator

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--timeout=900"
      - "--concurrency=4"
      - "--max-instances=3"
      # secrets + non-secret env come from the Cloud Run service config / a
      # --set-secrets / --set-env-vars you pass once (see DEPLOY.md); this build
      # only rolls the image.

options:
  logging: CLOUD_LOGGING_ONLY
